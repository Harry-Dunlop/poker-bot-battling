[project]
name = "pbb"
version = "0.1.0"
description = "Poker Bot Battleground: engine, sandboxed bot runner and CLI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "eval7>=0.1.11",
    "psutil>=5.9",
]

[project.scripts]
pbb = "pbb.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbb"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "vm_only: runs hostile bots; only inside the throwaway sandbox VM (never on a personal machine)",
]
addopts = "-m 'not vm_only'"
filterwarnings = ["ignore::DeprecationWarning:eval7.*"]
